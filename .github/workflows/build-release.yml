name: Build and Release DeepFaceNet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          echo "Freeing disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies & FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-glx \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libfuse2 \
            wget

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Standalone AppImage
        run: |
          chmod +x scripts/build_linux_appimage.sh
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./scripts/build_linux_appimage.sh

      - name: Inspect generated artifacts
        run: |
          ls -lh dist/

      - name: Upload Artifact (Action Run)
        uses: actions/upload-artifact@v4
        with:
          name: DeepFaceNet-Linux-x86_64-AppImage
          path: dist/DeepFaceNet-x86_64.AppImage
          retention-days: 7

      - name: Create GitHub Release and Upload Binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DeepFaceNet-x86_64.AppImage
          draft: false
          prerelease: false
          generate_release_notes: true

